# GTMax3D Core A2V2 modificada, com Klipper - BICO 0.6 mm
# Elaborado e testado por @mirandadam
#
# Configuração de referência da impressora do autor, em uso atualmente
# (a cópia mais antiga guardada com bico 0.6 é de setembro de 2023).
# Leia o README.md e o docs/hardware.md antes de usar. Resumo das premissas:
#
#   * Placa original: RAMPS 1.4 + Arduino Mega 2560, com firmware Klipper
#     (ver docs/firmware.md). Raspberry Pi ligado à RAMPS pelo cabo USB.
#   * Drivers TMC2209 em modo standalone (1/16). Em cada motor, os DOIS FIOS
#     DE UMA DAS BOBINAS FORAM TROCADOS DE POSIÇÃO no conector, o que inverte o
#     sentido de giro. Os dir_pin abaixo valem para essa ligação. Com outra
#     combinação de drivers e fios, veja "Direção dos motores" no
#     docs/hardware.md antes de ligar os motores.
#   * Hotend e extrusora originais, com bico trocado para 0.6 mm.
#   * Acelerômetro ADXL345 na cabeça de impressão, ligado ao SPI do Raspberry
#     Pi. Sem acelerômetro, siga "Sem acelerômetro" em docs/acelerometro.md.
#
# Os valores de PID, z_offset, pressure_advance e input shaper abaixo são os
# da impressora do autor. Recalibre na sua (ver docs/instalacao.md).
#
# As macros M600, M601, M300 e CANCEL_PRINT foram testadas só em simulação
# (modo batch do Klipper), ainda não na impressora.
#
# Diferenças em relação ao arquivo do bico 0.4 (lista completa):
#   nozzle_diameter, pressure_advance (e pressure_advance_smooth_time),
#   square_corner_velocity, z_offset, idle_timeout e o PID do bico e da mesa.

[printer]
kinematics: corexy
max_velocity: 100 # 300 é possível, mas faz barulhos estranhos; 150 às vezes dá ressonância
max_accel: 4000 # depende do input shaper; sem ele, use 1500
max_z_velocity: 20
max_z_accel: 100
square_corner_velocity: 5.0

[idle_timeout]
# tempo sem atividade até desligar aquecedores e motores (também vale durante uma pausa)
timeout: 14400 # 4 horas

[gcode_arcs]
# suporte a G2/G3 (arcos gerados pelo fatiador)
resolution: 0.5

[stepper_x]
step_pin: PF0
dir_pin: !PF1 # TMC2209 com fios trocados (ver cabeçalho)
enable_pin: !PD7
microsteps: 16
rotation_distance: 40 # 20 dentes/volta * 2 mm/dente = 40 mm por volta
endstop_pin: ^!PE5
position_endstop: -18
position_max: 240 # a mesa acaba em 227
position_min: -18
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7 # TMC2209 com fios trocados (ver cabeçalho)
enable_pin: !PF2
microsteps: 16
rotation_distance: 40 # 20 dentes/volta * 2 mm/dente = 40 mm por volta
endstop_pin: ^!PJ1
position_endstop: -9
position_max: 230 # a mesa acaba em 229
position_min: -9
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: !PL1 # TMC2209 com fios trocados (ver cabeçalho)
enable_pin: !PK0
microsteps: 16
rotation_distance: 8 # 0.04 mm por passo * 200 passos por volta = 8 mm por volta
endstop_pin: ^!PD2
position_endstop: 243 # o fim de curso do Z fica embaixo (mesa no ponto mais baixo)
position_max: 244
position_min: -2

[input_shaper]
# Medido com o ADXL345 em 2 de junho de 2022. Meça na sua impressora (ver
# docs/acelerometro.md).
shaper_freq_x: 80.8
shaper_type_x: 3hump_ei
shaper_freq_y: 90.8
shaper_type_y: 3hump_ei

[extruder]
step_pin: PA4
dir_pin: PA6 # TMC2209 com fios trocados (ver cabeçalho)
enable_pin: !PA2
microsteps: 16
# Para aumentar a extrusão, diminua o rotation_distance, e vice-versa.
rotation_distance: 19.15 # extrusora original; calibrado com ABS
# ABS GTMax3D branco, 228 °C. Outros valores já usados neste bico:
#   Tritan: pressure_advance 1.8 (com aceleração baixa)
pressure_advance: 0.6
pressure_advance_smooth_time: 0.1 # suaviza a compensação e alivia a extrusora
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
# PID da impressora do autor. Recalibre com:
#   PID_CALIBRATE HEATER=extruder TARGET=240
#   SAVE_CONFIG
control: pid
pid_kp: 23.925
pid_ki: 1.318
pid_kd: 108.559
min_temp: 0
max_temp: 295
max_extrude_only_accel: 3000

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
# PID da impressora do autor. Recalibre com:
#   PID_CALIBRATE HEATER=heater_bed TARGET=105
#   SAVE_CONFIG
control: pid
pid_kp: 11.634
pid_ki: 0.419
pid_kd: 80.709
min_temp: 0
max_temp: 130
# ATENÇÃO: NÃO AUMENTE O max_power. Com 1.0 a mesa esquenta rápido demais,
# com risco de queimar a resistência ou quebrar o vidro.
max_power: 0.2

[bed_mesh]
probe_count: 4,4
algorithm: bicubic
mesh_min: 30,30
mesh_max: 190,190
speed: 50
horizontal_move_z: 8

[probe]
# sonda original, que desce quando a cabeça de impressão vai a X43 Y-5 (ver macro G29)
pin: ^PD3
x_offset: -13
y_offset: 35
# Bico longe da mesa na primeira camada: aumente o z_offset. Bico raspando: diminua.
# Depende do comprimento do bico: recalibre sempre que trocar o bico.
z_offset: 4.80
speed: 5.0
sample_retract_dist: 2.0
lift_speed: 5
samples: 1

[fan]
pin: PH6

[mcu]
# Troque pelo identificador do seu Arduino. Descubra com:
#   ls /dev/serial/by-id/
serial: /dev/serial/by-id/usb-Arduino__www.arduino.cc__0042_XXXXXXXXXXXXXXXXXXXX-if00

# --- Acelerômetro ADXL345 no Raspberry Pi (ver docs/acelerometro.md) ---
# O [mcu rpi] impede o Klipper de iniciar se o serviço klipper_mcu não estiver
# rodando; o ADXL345 em si só é lido durante uma medição.
[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
    110,110,20

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[respond]
# permite que as macros mostrem mensagens no console

# Mapa de pinos comum às RAMPS 1.3 ou mais recentes (do exemplo do Klipper).
[board_pins]
aliases:
    # conector EXP1
    EXP1_1=PC0, EXP1_3=PH0, EXP1_5=PA1, EXP1_7=PA5, EXP1_9=<GND>,
    EXP1_2=PC2, EXP1_4=PH1, EXP1_6=PA3, EXP1_8=PA7, EXP1_10=<5V>,
    # conector EXP2
    EXP2_1=PB3, EXP2_3=PC6, EXP2_5=PC4, EXP2_7=PL0, EXP2_9=<GND>,
    EXP2_2=PB1, EXP2_4=PB0, EXP2_6=PB2, EXP2_8=PG0, EXP2_10=<RST>

[filament_switch_sensor sensor_filamento]
# Sensor de fim de filamento original. Quando o filamento acaba durante uma
# impressão, chama o M600: pausa, afasta a cabeça de impressão da peça e bipa.
# O pause_on_runout fica desligado porque o Klipper dispara o sensor com
# qualquer movimento, e não só durante uma impressão: um DESCARREGAR_FILAMENTO
# faria um PAUSE que ficaria pendente e impediria a impressão seguinte de pausar.
pause_on_runout: False
runout_gcode:
    {% if printer.print_stats.state == "printing" %}
        M600
    {% endif %}
switch_pin: ^!PK1

# A A2V2 usa o RepRapDiscount Smart Controller 2004 (LCD 20x4)
[display]
lcd_type: hd44780
rs_pin: EXP1_4
e_pin: EXP1_3
d4_pin: EXP1_5
d5_pin: EXP1_6
d6_pin: EXP1_7
d7_pin: EXP1_8
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

# ---------------------------------------------------------------------------
# Macros
# ---------------------------------------------------------------------------

[gcode_macro G29]
description: Leva os eixos à origem (G28) e mede a malha da mesa com a sonda
gcode:
    BED_MESH_CLEAR
    G28
    G0 X43 Y-5 Z20 F4000 # esta posição provoca a descida da sonda
    BED_MESH_CALIBRATE
    G0 Z2 F500 # comprime a sonda o suficiente para recolhê-la
    G0 Z20 F500

[gcode_macro M300]
description: Bipe. P = duração em milissegundos (S, a frequência, é ignorada)
gcode:
    {% set duracao = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=1
    G4 P{duracao}
    SET_PIN PIN=beeper VALUE=0

[gcode_macro M600]
description: Troca de filamento: pausa a impressão (se houver uma), afasta a cabeça de impressão e bipa
gcode:
    {% set th = printer.toolhead %}
    # X e Y em coordenadas do G-code, as mesmas do G1 abaixo; a origem cobre o
    # SET_GCODE_OFFSET e o G92
    {% set gm = printer.gcode_move %}
    {% set origem = {"x": gm.position.x - gm.gcode_position.x, "y": gm.position.y - gm.gcode_position.y} %}
    {% set estado = printer.print_stats.state %}
    {% set imprimindo = estado == "printing" %}
    {% set pausa_sobrando = printer.pause_resume.is_paused and estado != "printing" and estado != "paused" %}
    {% set x = [[params.X|default(0)|float, th.axis_minimum.x - origem.x]|max, th.axis_maximum.x - origem.x]|min %}
    {% set y = [[params.Y|default(100)|float, th.axis_minimum.y - origem.y]|max, th.axis_maximum.y - origem.y]|min %}
    {% set ja_estacionada = (th.position.x - origem.x - x)|abs < 0.1 and (th.position.y - origem.y - y)|abs < 0.1 %}
    {% if imprimindo %}
        {% if printer.pause_resume.is_paused %}
            # pausa que sobrou de antes da impressão (um PAUSE digitado no console)
            CLEAR_PAUSE
        {% endif %}
        PAUSE
    {% elif pausa_sobrando %}
        # sem impressão, a pausa não tem o que retomar; um RESUME levaria o bico à posição de antes
        CLEAR_PAUSE
    {% endif %}
    {% if th.homed_axes == "xyz" and not ja_estacionada %}
        # sobe até 10 mm (parâmetro Z), com 1 mm de folga do fim do curso
        {% set sobe = [params.Z|default(10)|float, th.axis_maximum.z - th.position.z - 1]|min %}
        G91
        {% if sobe > 0 %}
            G1 Z{sobe} F600
        {% endif %}
        G90
        G1 X{x} Y{y} F4000
        M400
    {% endif %}
    M300 P1000
    {% if imprimindo or estado == "paused" %}
        RESPOND MSG="Pausa para troca de filamento. Use DESCARREGAR_FILAMENTO, CARREGAR_FILAMENTO e depois RESUME."
    {% elif pausa_sobrando %}
        RESPOND MSG="Nenhuma impressão em andamento: a pausa que tinha sobrado foi descartada e a cabeça de impressão foi afastada."
    {% else %}
        RESPOND MSG="Nenhuma impressão em andamento: a cabeça de impressão foi afastada, sem pausa."
    {% endif %}

[gcode_macro M601]
description: Pausa pedida pelo fatiador (mesmo comportamento do M600)
gcode:
    M600 {rawparams}

[gcode_macro DESCARREGAR_FILAMENTO]
description: Puxa 600 mm de filamento (bico precisa estar a 170 °C ou mais)
gcode:
    {% if printer.extruder.temperature >= 170 %}
        SAVE_GCODE_STATE NAME=descarregar_estado
        M300 P100
        G4 P9900 # aguarda ~10 s antes de puxar
        M83
        {% for i in range(12) %}
            G1 F2400 E-50
        {% endfor %}
        RESTORE_GCODE_STATE NAME=descarregar_estado
        # desliga só a extrusora; M84/M18 desligariam todos os motores e a
        # impressora perderia a referência dos eixos no meio de uma pausa
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    {% else %}
        RESPOND TYPE=error MSG="Aqueça o bico a 170 °C ou mais antes de descarregar."
    {% endif %}

[gcode_macro CARREGAR_FILAMENTO]
description: Empurra 550 mm de filamento; os últimos 100 mm devagar (bico a 170 °C ou mais)
gcode:
    {% if printer.extruder.temperature >= 170 %}
        SAVE_GCODE_STATE NAME=carregar_estado
        M300 P100
        G4 P900
        M83
        {% for i in range(9) %}
            G1 F2400 E50
        {% endfor %}
        G1 F300 E50
        G1 F300 E50
        RESTORE_GCODE_STATE NAME=carregar_estado
    {% else %}
        RESPOND TYPE=error MSG="Aqueça o bico a 170 °C ou mais antes de carregar."
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancela a impressão, desliga os aquecedores, recolhe o filamento e afasta a cabeça de impressão
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set th = printer.toolhead %}
    # primeiro o que precisa acontecer em qualquer estado da impressora
    TURN_OFF_HEATERS
    M106 S0
    M220 S100 # velocidade de volta a 100%
    M221 S100 # fluxo de volta a 100%
    G91
    {% if printer.extruder.can_extrude %}
        G1 F1800 E-3 # recolhe 3 mm para não escorrer
    {% endif %}
    {% if th.homed_axes == "xyz" %}
        {% if th.position.z + 3 < th.axis_maximum.z %}
            G0 Z3 F4000
        {% endif %}
        G90
        G0 X0 Y100 F4000
    {% endif %}
    G90
    M400
    M84
    CANCEL_PRINT_BASE
